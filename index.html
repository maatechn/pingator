<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pingator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; }

    .titlebar {
      height: 36px;
      background: #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 14px;
      user-select: none;
      -webkit-app-region: drag;
    }

    .titlebar-title {
      font-size: 13px;
      color: #cccccc;
    }

    .titlebar-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: #cccccc;
      font-size: 14px;
      cursor: pointer;
    }

    .titlebar-btn:hover { background: #3e3e3e; color: #fff; }
    .titlebar-btn.close:hover { background: #e81123; color: #fff; }

    .content { padding: 20px; }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-title">Pingator</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="min-btn">—</button>
      <button class="titlebar-btn" id="max-btn">☐</button>
      <button class="titlebar-btn close" id="close-btn">✕</button>
    </div>
  </header>

  <main class="content">
    
  </main>

  <script>
    document.getElementById('min-btn').addEventListener('click', () => window.windowControls.minimize());
    document.getElementById('max-btn').addEventListener('click', () => window.windowControls.maximize());
    document.getElementById('close-btn').addEventListener('click', () => window.windowControls.close());
  </script>
</body>
</html>
