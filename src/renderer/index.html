<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pingator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; }

    .titlebar {
      height: 36px;
      background: #2d2d2d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 14px;
      user-select: none;
      -webkit-app-region: drag;
    }

    .titlebar-title {
      font-size: 13px;
      color: #cccccc;
    }

    .titlebar-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }

    .titlebar-btn {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: #cccccc;
      font-size: 14px;
      cursor: pointer;
    }

    .titlebar-btn:hover { background: #3e3e3e; color: #fff; }
    .titlebar-btn.close:hover { background: #e81123; color: #fff; }

    .content { padding: 20px; }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-title">Pingator</div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="min-btn">—</button>
      <button class="titlebar-btn" id="max-btn">☐</button>
      <button class="titlebar-btn close" id="close-btn">✕</button>
    </div>
  </header>

  <main class="content">
    <button id="add-btn" class="btn-plus" aria-label="Добавить элемент">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</button>
  </main>

  <script>
    document.getElementById('min-btn').addEventListener('click', () => window.windowControls.minimize());
    document.getElementById('max-btn').addEventListener('click', () => window.windowControls.maximize());
    document.getElementById('close-btn').addEventListener('click', () => window.windowControls.close());
  </script>
</body>
</html>
